name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-wrapper.jar 未随仓库提交（本地无环境无法生成）：
      # 在 CI 上用下载的 Gradle 发行版生成完整 wrapper，再走 ./gradlew。
      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gree-remote-debug
          path: app/build/outputs/apk/debug/*.apk